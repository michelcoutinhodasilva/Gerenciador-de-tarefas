<section class="kanban-column" [attr.data-status]="status()" [attr.aria-label]="label()">
  <header class="column-header">
    <div class="column-title-group">
      <span class="column-status-dot" [class]="dotColor()" aria-hidden="true"></span>
      <h2>{{ label() }}</h2>
      <span data-testid="count" class="column-count">{{ tasks().length }}</span>
    </div>
    <button
      type="button"
      data-testid="add"
      class="column-add"
      [attr.aria-label]="'Nova tarefa em ' + label()"
      title="Nova tarefa"
      (click)="add.emit()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>
  </header>

  <div
    cdkDropList
    [cdkDropListData]="status()"
    [cdkDropListDisabled]="filtering()"
    (cdkDropListDropped)="dropped.emit($event)"
    class="column-cards"
  >
    @for (task of tasks(); track task.id) {
      <app-task-card
        cdkDrag
        [cdkDragData]="task"
        [task]="task"
        [today]="today()"
        (edit)="edit.emit(task)"
        (remove)="remove.emit(task)"
        (complete)="complete.emit(task)"
      />
    } @empty {
      <p class="column-empty">
        {{ filtering() ? 'Nenhuma tarefa encontrada' : 'Arraste uma tarefa para cá' }}
      </p>
    }
  </div>
</section>
