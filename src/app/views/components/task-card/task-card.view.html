<article
  class="task-card"
  [attr.data-status]="task().status"
  [class.task-card--overdue]="overdue()"
  [class.task-card--done]="task().status === 'done'"
  (dblclick)="edit.emit()"
>
  <div class="task-card-heading">
    <h3 class="task-title" [class.task-title--done]="task().status === 'done'">
      {{ task().title }}
    </h3>

    <div class="task-actions">
      @if (task().status !== 'done') {
        <button
          type="button"
          data-testid="complete"
          class="task-action task-action--complete"
          aria-label="Concluir tarefa"
          title="Concluir"
          (click)="complete.emit()"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            aria-hidden="true"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
      }
      <button
        type="button"
        data-testid="edit"
        class="task-action"
        aria-label="Editar tarefa"
        title="Editar"
        (click)="edit.emit()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
      </button>
      <button
        type="button"
        data-testid="remove"
        class="task-action task-action--remove"
        aria-label="Excluir tarefa"
        title="Excluir"
        (click)="remove.emit()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" />
        </svg>
      </button>
    </div>
  </div>

  @if (task().description) {
    <p class="task-description">{{ task().description }}</p>
  }

  <div class="task-card-meta">
    <span class="task-priority" [class]="priorityStyle()" data-testid="priority">
      <span aria-hidden="true"></span>{{ priorityLabel() }}
    </span>

    @if (task().dueDate) {
      <time
        class="task-due"
        [class]="dueStyle()"
        data-testid="due"
        [attr.datetime]="task().dueDate"
        title="Prazo"
      >
        {{ duePrefix() }}{{ task().dueDate + 'T00:00:00' | date: 'dd/MM' }}
      </time>
    }

    <time class="task-created" [attr.datetime]="task().createdAt" title="Criada em">
      {{ task().createdAt | date: 'dd/MM/yyyy' }}
    </time>
  </div>
</article>
