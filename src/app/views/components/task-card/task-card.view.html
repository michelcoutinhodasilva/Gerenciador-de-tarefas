<article
  class="group cursor-grab rounded-lg border border-white/5 bg-zinc-800/60 p-3 shadow-sm transition-colors hover:border-white/15 hover:bg-zinc-800 active:cursor-grabbing"
  (dblclick)="edit.emit()"
>
  <div class="flex items-start justify-between gap-2">
    <h3 class="min-w-0 break-words text-sm font-medium leading-snug text-zinc-100">
      {{ task().title }}
    </h3>

    <div
      class="flex shrink-0 gap-0.5 opacity-0 transition-opacity group-hover:opacity-100 focus-within:opacity-100"
    >
      <button
        type="button"
        data-testid="edit"
        class="rounded p-1 text-zinc-400 hover:bg-white/10 hover:text-zinc-100"
        aria-label="Editar tarefa"
        title="Editar"
        (click)="edit.emit()"
      >
        <svg
          class="size-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
      </button>
      <button
        type="button"
        data-testid="remove"
        class="rounded p-1 text-zinc-400 hover:bg-red-500/15 hover:text-red-400"
        aria-label="Excluir tarefa"
        title="Excluir"
        (click)="remove.emit()"
      >
        <svg
          class="size-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" />
        </svg>
      </button>
    </div>
  </div>

  @if (task().description) {
    <p class="mt-1.5 line-clamp-3 whitespace-pre-line text-xs leading-relaxed text-zinc-400">
      {{ task().description }}
    </p>
  }

  <time class="mt-2.5 block text-[11px] text-zinc-500" [attr.datetime]="task().createdAt">
    {{ task().createdAt | date: 'dd/MM/yyyy' }}
  </time>
</article>
