<main class="relative grid min-h-dvh place-items-center overflow-hidden px-4">
  <div
    class="pointer-events-none absolute -top-40 left-1/2 h-96 w-[40rem] -translate-x-1/2 rounded-full bg-indigo-600/20 blur-3xl"
    aria-hidden="true"
  ></div>

  <section class="relative w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center gap-3 text-center">
      <div
        class="grid size-10 place-items-center rounded-lg bg-indigo-500 text-lg font-semibold text-white"
      >
        T
      </div>
      <h1 class="text-xl font-semibold tracking-tight text-zinc-100">
        {{ mode() === 'signIn' ? 'Entre na sua conta' : 'Crie sua conta' }}
      </h1>
      <p class="text-sm text-zinc-500">Organize suas tarefas em um quadro Kanban.</p>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="flex flex-col gap-4 rounded-xl border border-white/5 bg-zinc-900/60 p-6 shadow-2xl backdrop-blur"
    >
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium text-zinc-300">E-mail</span>
        <input
          pInputText
          type="email"
          formControlName="email"
          data-testid="email"
          placeholder="voce@empresa.com"
          autocomplete="email"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium text-zinc-300">Senha</span>
        <input
          pInputText
          type="password"
          formControlName="password"
          data-testid="password"
          placeholder="••••••••"
          [attr.autocomplete]="mode() === 'signIn' ? 'current-password' : 'new-password'"
        />
      </label>

      @if (auth.error(); as error) {
        <p
          data-testid="error"
          role="alert"
          class="rounded-md bg-red-500/10 px-3 py-2 text-sm text-red-400"
        >
          {{ error }}
        </p>
      }

      <p-button
        type="submit"
        [label]="mode() === 'signIn' ? 'Entrar' : 'Criar conta'"
        [loading]="auth.loading()"
        [fluid]="true"
      />
    </form>

    <p class="mt-6 text-center text-sm text-zinc-500">
      {{ mode() === 'signIn' ? 'Ainda não tem conta?' : 'Já tem conta?' }}
      <button
        type="button"
        data-testid="toggle-mode"
        class="font-medium text-indigo-400 hover:text-indigo-300"
        (click)="toggleMode()"
      >
        {{ mode() === 'signIn' ? 'Cadastre-se' : 'Entrar' }}
      </button>
    </p>
  </section>
</main>
